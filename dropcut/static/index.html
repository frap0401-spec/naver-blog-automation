<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>드롭컷 · 쇼핑쇼츠 편집 에이전트</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <div class="brand"><span class="logo">✂</span> 드롭컷 <small>쇼핑쇼츠 편집 에이전트</small></div>
  <ol class="steps" id="steps">
    <li data-step="1">올리기</li>
    <li data-step="2">원고 고르기</li>
    <li data-step="3">목소리 고르기</li>
    <li data-step="4">만들기</li>
    <li data-step="5">내보내기</li>
  </ol>
</header>

<main>
  <!-- 1. 올리기 -->
  <section id="s1" class="panel">
    <h2>1. 상품 영상 올리기</h2>
    <label class="drop" id="drop">
      <input type="file" id="files" accept="video/*" multiple hidden>
      <div class="drop-icon">⬆</div>
      <div><b>영상을 끌어다 놓거나 클릭해서 선택</b></div>
      <div class="muted">상품 원본·리뷰 영상 여러 개 가능 (mp4, mov, webm)</div>
      <ul id="filelist"></ul>
    </label>
    <div class="grid2">
      <label>상품명 <span class="muted">(비우면 AI가 영상을 보고 정함)</span>
        <input id="pname" placeholder="예: 강아지 자동 급수기">
      </label>
      <label>쿠팡 파트너스 링크 <span class="muted">(선택)</span>
        <input id="plink" placeholder="https://link.coupang.com/a/...">
      </label>
    </div>
    <label>강조할 특징 메모 <span class="muted">(선택)</span>
      <textarea id="pnotes" rows="2" placeholder="예: 세척이 쉬움, 소음 없음, 2L 대용량"></textarea>
    </label>

    <div class="modes">
      <label class="mode"><input type="radio" name="mode" value="ai" checked>
        <b>AI 자동 원고</b><span class="muted">영상을 보고 원고 3개 + 장면 배치까지 (Claude API 키 필요)</span></label>
      <label class="mode"><input type="radio" name="mode" value="manual">
        <b>원고 직접 입력</b><span class="muted">결제 없이 사용 · 내가 쓴 원고로 컷편집·자막·나레이션 자동</span></label>
    </div>
    <div id="manualBox" hidden>
      <div class="copy-h">원고 <span>
        <button type="button" id="btnPrompt" title="claude.ai 채팅에 붙여넣을 요청문을 복사합니다">claude.ai용 요청문 복사</button>
        <button type="button" id="btnExample">예시 넣기</button></span></div>
      <textarea id="scriptText" rows="12" placeholder="한 줄에 한 문장씩 나레이션을 적으세요.&#10;위쪽에 '상단1: / 상단2: / 제목: / 설명: / 해시태그: / 고정댓글:' 을 적으면 함께 적용됩니다."></textarea>
      <p class="muted">💡 claude.ai 채팅(무료/구독)에 요청문을 붙여넣고, 나온 답을 그대로 여기에 붙여넣으면 됩니다.</p>
    </div>
    <button class="primary" id="btnUpload" disabled>올리고 원고 만들기</button>
    <div class="status" id="st1" hidden>
      <div class="bar"><i></i></div><span></span>
    </div>
  </section>

  <!-- 2. 원고 고르기 -->
  <section id="s2" class="panel" hidden>
    <h2>2. 원고 고르기</h2>
    <p class="muted" id="summary"></p>
    <div class="scripts" id="scripts"></div>
    <button class="primary" id="btnScript" disabled>이 원고로 진행</button>
  </section>

  <!-- 3. 목소리 고르기 -->
  <section id="s3" class="panel" hidden>
    <h2>3. 목소리 고르기</h2>
    <div class="voices" id="voices"></div>
    <div class="grid2">
      <label>말 속도 <b id="rateVal">+10%</b>
        <input type="range" id="rate" min="-20" max="40" step="5" value="10">
      </label>
      <label>배경음악 <span class="muted">(assets/bgm 폴더의 파일)</span>
        <select id="bgm"><option value="">없음</option></select>
      </label>
    </div>
    <button class="primary" id="btnRender" disabled>만들기</button>
  </section>

  <!-- 4. 만들기 -->
  <section id="s4" class="panel" hidden>
    <h2>4. 만드는 중</h2>
    <div class="status big" id="st4">
      <div class="bar"><i></i></div><span></span>
    </div>
    <p class="muted">컷편집 · 나레이션 · 자막 · 제목을 자동으로 합치고 있어요.</p>
  </section>

  <!-- 5. 내보내기 -->
  <section id="s5" class="panel" hidden>
    <h2>5. 내보내기</h2>
    <div class="result">
      <video id="preview" controls playsinline></video>
      <div class="meta">
        <div class="dl">
          <a class="primary btn" id="dlVideo">영상 저장 (mp4)</a>
          <a class="btn" id="dlTxt">업로드 문구 (txt)</a>
          <a class="btn" id="dlSrt">자막 (srt)</a>
        </div>
        <div class="copy"><div class="copy-h">제목 <button data-copy="exTitle">복사</button></div><pre id="exTitle"></pre></div>
        <div class="copy"><div class="copy-h">설명란 <button data-copy="exDesc">복사</button></div><pre id="exDesc"></pre></div>
        <div class="copy"><div class="copy-h">고정 댓글 <button data-copy="exPin">복사</button></div><pre id="exPin"></pre></div>
        <div class="row">
          <button class="btn" id="btnBack">원고·목소리 바꿔서 다시 만들기</button>
          <button class="btn" id="btnNew">새 상품</button>
        </div>
      </div>
    </div>
  </section>

  <div class="error" id="err" hidden></div>
</main>
<script src="app.js"></script>
</body>
</html>
